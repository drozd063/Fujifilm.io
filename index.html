<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <title>Fujifilm X100VI Recipes Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Fujifilm-like dial aesthetics */
        .dial-input {
            background-color: #1f1f1f;
            border: 1px solid #333;
            transition: all 0.2s;
        }
        .dial-input:focus {
            border-color: #d32f2f; /* Fujifilm Red */
            outline: none;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.2);
        }

        .recipe-card {
            background: #1e1e1e;
            border-left: 4px solid #d32f2f;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444; 
        }

        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #d32f2f;
            cursor: pointer;
            margin-top: -6px; 
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-700 rounded text-white flex items-center justify-center font-bold">X</div>
                <h1 class="text-xl font-bold tracking-tight">Fujifilm <span class="text-red-600">X100VI</span> Recipes</h1>
            </div>
            <button onclick="toggleForm()" id="toggleBtn" class="bg-zinc-800 hover:bg-zinc-700 text-sm px-4 py-2 rounded-md transition border border-zinc-700">
                <i class="fas fa-plus mr-2"></i>Новый рецепт
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">

        <!-- Form Section -->
        <div id="formContainer" class="hidden mb-8 bg-zinc-900 p-6 rounded-lg border border-zinc-800 shadow-xl">
            <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-2">
                <h2 class="text-lg font-semibold">Настройки рецепта</h2>
                <button onclick="toggleForm()" class="text-zinc-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <form id="recipeForm" class="space-y-6">
                <!-- Basic Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Название рецепта</label>
                        <input type="text" id="name" placeholder="например, Kodachrome 64" class="dial-input w-full p-2 rounded text-white placeholder-zinc-600" required>
                    </div>
                </div>

                <!-- Main Settings Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <!-- Simulation -->
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Film Simulation</label>
                        <select id="filmSim" class="dial-input w-full p-2 rounded text-white">
                            <option value="PROVIA/Standard">PROVIA / Standard</option>
                            <option value="Velvia/Vivid">Velvia / Vivid</option>
                            <option value="ASTIA/Soft">ASTIA / Soft</option>
                            <option value="Classic Chrome">Classic Chrome</option>
                            <option value="REALA ACE">REALA ACE</option>
                            <option value="PRO Neg. Hi">PRO Neg. Hi</option>
                            <option value="PRO Neg. Std">PRO Neg. Std</option>
                            <option value="Classic Neg.">Classic Neg.</option>
                            <option value="ETERNA/Cinema">ETERNA / Cinema</option>
                            <option value="ETERNA Bleach Bypass">ETERNA Bleach Bypass</option>
                            <option value="ACROS">ACROS (+ Ye/R/G)</option>
                            <option value="Monochrome">Monochrome (+ Ye/R/G)</option>
                            <option value="Sepia">Sepia</option>
                        </select>
                    </div>

                    <!-- Grain -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Grain Roughness</label>
                            <select id="grainRoughness" class="dial-input w-full p-2 rounded text-white text-sm">
                                <option value="Off">Off</option>
                                <option value="Weak">Weak</option>
                                <option value="Strong">Strong</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Grain Size</label>
                            <select id="grainSize" class="dial-input w-full p-2 rounded text-white text-sm">
                                <option value="Small">Small</option>
                                <option value="Large">Large</option>
                            </select>
                        </div>
                    </div>

                    <!-- Color Chrome -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Color Chrome</label>
                            <select id="colorChrome" class="dial-input w-full p-2 rounded text-white text-sm">
                                <option value="Off">Off</option>
                                <option value="Weak">Weak</option>
                                <option value="Strong">Strong</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Color Chrome FX Blue</label>
                            <select id="colorChromeBlue" class="dial-input w-full p-2 rounded text-white text-sm">
                                <option value="Off">Off</option>
                                <option value="Weak">Weak</option>
                                <option value="Strong">Strong</option>
                            </select>
                        </div>
                    </div>

                    <!-- White Balance -->
                    <div class="col-span-1 md:col-span-2 lg:col-span-1">
                        <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">White Balance</label>
                        <div class="flex gap-2 mb-2">
                            <select id="wbType" class="dial-input w-2/3 p-2 rounded text-white text-sm" onchange="toggleKelvin()">
                                <option value="Auto">Auto</option>
                                <option value="Kelvin">Kelvin (K)</option>
                                <option value="Daylight">Daylight</option>
                                <option value="Shade">Shade</option>
                                <option value="Fluorescent 1">Fluorescent 1</option>
                                <option value="Fluorescent 2">Fluorescent 2</option>
                                <option value="Fluorescent 3">Fluorescent 3</option>
                                <option value="Incandescent">Incandescent</option>
                                <option value="Underwater">Underwater</option>
                            </select>
                            <input type="number" id="wbKelvin" placeholder="K" class="dial-input w-1/3 p-2 rounded text-white text-sm hidden" min="2500" max="10000" step="10">
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-1 w-1/2">
                                <span class="text-red-500 text-xs font-bold">R</span>
                                <input type="number" id="wbShiftR" class="dial-input w-full p-1 text-center rounded text-white text-sm" min="-9" max="9" value="0">
                            </div>
                            <div class="flex items-center gap-1 w-1/2">
                                <span class="text-blue-500 text-xs font-bold">B</span>
                                <input type="number" id="wbShiftB" class="dial-input w-full p-1 text-center rounded text-white text-sm" min="-9" max="9" value="0">
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Range -->
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">Dynamic Range</label>
                        <select id="dynamicRange" class="dial-input w-full p-2 rounded text-white">
                            <option value="DR100">DR100</option>
                            <option value="DR200">DR200</option>
                            <option value="DR400">DR400</option>
                            <option value="Auto">DR Auto</option>
                        </select>
                    </div>

                    <!-- Highlights & Shadows -->
                    <div>
                        <div class="mb-3">
                            <div class="flex justify-between mb-1">
                                <label class="text-xs uppercase tracking-wider text-zinc-500">Highlights</label>
                                <span id="highlightVal" class="text-xs font-mono text-white">0</span>
                            </div>
                            <input type="range" id="highlight" min="-2" max="4" step="0.5" value="0" class="w-full" oninput="updateVal('highlight', 'highlightVal')">
                        </div>
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-xs uppercase tracking-wider text-zinc-500">Shadows</label>
                                <span id="shadowVal" class="text-xs font-mono text-white">0</span>
                            </div>
                            <input type="range" id="shadow" min="-2" max="4" step="0.5" value="0" class="w-full" oninput="updateVal('shadow', 'shadowVal')">
                        </div>
                    </div>

                    <!-- Color -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs uppercase tracking-wider text-zinc-500">Color</label>
                            <span id="colorVal" class="text-xs font-mono text-white">0</span>
                        </div>
                        <input type="range" id="color" min="-4" max="4" step="1" value="0" class="w-full" oninput="updateVal('color', 'colorVal')">
                    </div>

                    <!-- Sharpness -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs uppercase tracking-wider text-zinc-500">Sharpness</label>
                            <span id="sharpnessVal" class="text-xs font-mono text-white">0</span>
                        </div>
                        <input type="range" id="sharpness" min="-4" max="4" step="1" value="0" class="w-full" oninput="updateVal('sharpness', 'sharpnessVal')">
                    </div>

                    <!-- High ISO NR -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs uppercase tracking-wider text-zinc-500">High ISO NR</label>
                            <span id="nrVal" class="text-xs font-mono text-white">0</span>
                        </div>
                        <input type="range" id="nr" min="-4" max="4" step="1" value="0" class="w-full" oninput="updateVal('nr', 'nrVal')">
                    </div>

                    <!-- Clarity -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-xs uppercase tracking-wider text-zinc-500">Clarity</label>
                            <span id="clarityVal" class="text-xs font-mono text-white">0</span>
                        </div>
                        <input type="range" id="clarity" min="-5" max="5" step="1" value="0" class="w-full" oninput="updateVal('clarity', 'clarityVal')">
                    </div>
                    
                </div>
                
                <!-- ISO Info (Optional) -->
                <div class="border-t border-zinc-800 pt-4">
                     <label class="block text-xs uppercase tracking-wider text-zinc-500 mb-1">ISO Comment (Optional)</label>
                     <input type="text" id="isoComment" placeholder="например, Auto ISO 6400, Min Shutter 1/125" class="dial-input w-full p-2 rounded text-white text-sm placeholder-zinc-600">
                </div>

                <!-- Submit -->
                <div class="flex justify-end pt-4">
                    <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-6 rounded transition shadow-lg shadow-red-900/20">
                        Сохранить рецепт
                    </button>
                </div>
            </form>
        </div>

        <!-- Search & Filter Toolbar -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 justify-between items-center bg-zinc-900 p-4 rounded-lg border border-zinc-800">
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                <!-- Film Sim Filter -->
                <!-- Search Name -->
                <div class="relative w-full md:w-auto">
                     <input type="text" id="filterName" oninput="applyFilters()" placeholder="Поиск по названию..." class="dial-input pl-10 pr-4 py-2 rounded text-white text-sm w-full md:w-48 placeholder-zinc-600">
                     <div class="absolute left-3 top-2.5 text-zinc-500 pointer-events-none">
                        <i class="fas fa-search"></i>
                    </div>
                </div>

                <!-- Film Sim Filter -->
                <div class="relative w-full md:w-auto">
                    <select id="filterSim" onchange="applyFilters()" class="dial-input appearance-none pl-10 pr-8 py-2 rounded text-white text-sm w-full md:w-64">
                        <option value="">Все симуляции</option>
                        <option value="PROVIA/Standard">PROVIA / Standard</option>
                        <option value="Velvia/Vivid">Velvia / Vivid</option>
                        <option value="ASTIA/Soft">ASTIA / Soft</option>
                        <option value="Classic Chrome">Classic Chrome</option>
                        <option value="REALA ACE">REALA ACE</option>
                        <option value="PRO Neg. Hi">PRO Neg. Hi</option>
                        <option value="PRO Neg. Std">PRO Neg. Std</option>
                        <option value="Classic Neg.">Classic Neg.</option>
                        <option value="ETERNA/Cinema">ETERNA / Cinema</option>
                        <option value="ETERNA Bleach Bypass">ETERNA Bleach Bypass</option>
                        <option value="ACROS">ACROS</option>
                        <option value="Monochrome">Monochrome</option>
                        <option value="Sepia">Sepia</option>
                    </select>
                    <div class="absolute left-3 top-2.5 text-zinc-500 pointer-events-none">
                        <i class="fas fa-film"></i>
                    </div>
                    <div class="absolute right-3 top-2.5 text-zinc-500 pointer-events-none">
                        <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- View Toggle -->
            <div class="flex bg-zinc-800 rounded p-1 border border-zinc-700">
                <button onclick="setViewMode('grid')" id="btnGrid" class="px-4 py-1.5 rounded text-sm transition bg-zinc-600 text-white shadow">
                    <i class="fas fa-th-large mr-2"></i>Карточки
                </button>
                <button onclick="setViewMode('table')" id="btnTable" class="px-4 py-1.5 rounded text-sm transition text-zinc-400 hover:text-white">
                    <i class="fas fa-table mr-2"></i>Таблица
                </button>
            </div>
        </div>

        <!-- Recipe Container -->
        <div id="recipesContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Cards will be injected here -->
        </div>

        <!-- Table Container (Hidden by default) -->
        <div id="tableContainer" class="hidden overflow-x-auto rounded-lg border border-zinc-800 shadow-xl">
            <table class="w-full text-sm text-left text-zinc-400">
                <thead class="text-xs text-zinc-200 uppercase bg-zinc-900">
                    <tr>
                        <th scope="col" class="px-4 py-3 sticky left-0 bg-zinc-900 z-10 border-b border-zinc-800">Название</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800">Film Sim</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">WB</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">DR</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">H</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">S</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">Col</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">Shrp</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">NR</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">Clr</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-center">Grn</th>
                        <th scope="col" class="px-4 py-3 border-b border-zinc-800 text-right">Действия</th>
                    </tr>
                </thead>
                <tbody id="recipesTableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-zinc-600 mb-4 text-4xl"><i class="fas fa-camera-retro"></i></div>
            <p class="text-zinc-500 text-lg">Нет сохраненных рецептов.</p>
            <p class="text-zinc-600 text-sm">Нажмите "Новый рецепт", чтобы добавить.</p>
        </div>

        <footer class="mt-12 text-center text-zinc-700 text-xs border-t border-zinc-800 pt-6 pb-2">
            <p>Designed for Fujifilm X100VI</p>
        </footer>

    </main>

    <script>
        // Data Handling
        let recipes = JSON.parse(localStorage.getItem('x100vi_recipes')) || [];
        let currentView = localStorage.getItem('x100vi_view') || 'grid';
        let currentFilter = '';

        // Initialize view state
        updateViewButtons();

        function saveRecipes() {
            localStorage.setItem('x100vi_recipes', JSON.stringify(recipes));
            applyFilters(); // Re-render with current filters
        }

        function setViewMode(mode) {
            currentView = mode;
            localStorage.setItem('x100vi_view', mode);
            updateViewButtons();
            applyFilters();
        }

        function updateViewButtons() {
            const btnGrid = document.getElementById('btnGrid');
            const btnTable = document.getElementById('btnTable');
            const gridContainer = document.getElementById('recipesContainer');
            const tableContainer = document.getElementById('tableContainer');

            if (currentView === 'grid') {
                btnGrid.classList.add('bg-zinc-600', 'text-white', 'shadow');
                btnGrid.classList.remove('text-zinc-400');
                btnTable.classList.remove('bg-zinc-600', 'text-white', 'shadow');
                btnTable.classList.add('text-zinc-400');
                
                gridContainer.classList.remove('hidden');
                gridContainer.classList.add('grid');
                tableContainer.classList.add('hidden');
            } else {
                btnTable.classList.add('bg-zinc-600', 'text-white', 'shadow');
                btnTable.classList.remove('text-zinc-400');
                btnGrid.classList.remove('bg-zinc-600', 'text-white', 'shadow');
                btnGrid.classList.add('text-zinc-400');

                gridContainer.classList.add('hidden');
                gridContainer.classList.remove('grid');
                tableContainer.classList.remove('hidden');
            }
        }

        function applyFilters() {
            renderRecipes();
        }

        // Form Helpers
        function toggleForm() {
            const form = document.getElementById('formContainer');
            const btn = document.getElementById('toggleBtn');
            form.classList.toggle('hidden');
            
            if (!form.classList.contains('hidden')) {
                btn.innerHTML = '<i class="fas fa-times mr-2"></i>Закрыть';
            } else {
                btn.innerHTML = '<i class="fas fa-plus mr-2"></i>Новый рецепт';
            }
        }

        function toggleKelvin() {
            const wbType = document.getElementById('wbType').value;
            const wbKelvin = document.getElementById('wbKelvin');
            if (wbType === 'Kelvin') {
                wbKelvin.classList.remove('hidden');
            } else {
                wbKelvin.classList.add('hidden');
            }
        }

        function updateVal(inputId, displayId) {
            const val = document.getElementById(inputId).value;
            let display = val;
            if (val > 0) display = '+' + val;
            document.getElementById(displayId).textContent = display;
        }

        function formatVal(val) {
            if (val > 0) return '+' + val;
            return val;
        }

        // CRUD Operations
        document.getElementById('recipeForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const recipe = {
                id: Date.now(),
                name: document.getElementById('name').value,
                filmSim: document.getElementById('filmSim').value,
                grainRoughness: document.getElementById('grainRoughness').value,
                grainSize: document.getElementById('grainSize').value,
                colorChrome: document.getElementById('colorChrome').value,
                colorChromeBlue: document.getElementById('colorChromeBlue').value,
                wbType: document.getElementById('wbType').value,
                wbKelvin: document.getElementById('wbKelvin').value,
                wbShiftR: document.getElementById('wbShiftR').value,
                wbShiftB: document.getElementById('wbShiftB').value,
                dynamicRange: document.getElementById('dynamicRange').value,
                highlight: document.getElementById('highlight').value,
                shadow: document.getElementById('shadow').value,
                color: document.getElementById('color').value,
                sharpness: document.getElementById('sharpness').value,
                nr: document.getElementById('nr').value,
                clarity: document.getElementById('clarity').value,
                isoComment: document.getElementById('isoComment').value
            };

            recipes.unshift(recipe); // Add to top
            saveRecipes();
            e.target.reset();
            
            // Reset sliders visual numbers
            ['highlight', 'shadow', 'color', 'sharpness', 'nr', 'clarity'].forEach(id => {
                document.getElementById(id + 'Val').textContent = '0';
            });
            toggleForm();
        });

        function deleteRecipe(id) {
            if(confirm('Удалить этот рецепт?')) {
                recipes = recipes.filter(r => r.id !== id);
                saveRecipes();
            }
        }

        function duplicateRecipe(id) {
            const original = recipes.find(r => r.id === id);
            if (original) {
                const newRecipe = { ...original, id: Date.now(), name: original.name + ' (Copy)' };
                recipes.unshift(newRecipe);
                saveRecipes();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderRecipes() {
            const gridContainer = document.getElementById('recipesContainer');
            const tableBody = document.getElementById('recipesTableBody');
            const emptyState = document.getElementById('emptyState');
            
            // Filter Logic
            const filterSim = document.getElementById('filterSim').value;
            const filterName = document.getElementById('filterName').value.toLowerCase();

            const filteredRecipes = recipes.filter(r => {
                const matchesSim = filterSim ? r.filmSim === filterSim : true;
                const matchesName = filterName ? r.name.toLowerCase().includes(filterName) : true;
                return matchesSim && matchesName;
            });

            gridContainer.innerHTML = '';
            tableBody.innerHTML = '';

            if (filteredRecipes.length === 0) {
                emptyState.classList.remove('hidden');
                // Also hide table header if empty? No, just show empty state.
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredRecipes.forEach(r => {
                // Calculate WB String
                let wbString = r.wbType;
                if (r.wbType === 'Kelvin' && r.wbKelvin) wbString = `${r.wbKelvin}K`;
                const shiftSignR = r.wbShiftR > 0 ? '+' : '';
                const shiftSignB = r.wbShiftB > 0 ? '+' : '';
                const wbShift = `R:${shiftSignR}${r.wbShiftR} B:${shiftSignB}${r.wbShiftB}`;

                // Calculate Grain String
                let grainString = 'Off';
                if (r.grainRoughness !== 'Off') {
                    grainString = `${r.grainRoughness}/${r.grainSize.charAt(0)}`;
                }

                // Render Grid Card
                if (currentView === 'grid') {
                    const card = document.createElement('div');
                    card.className = 'recipe-card rounded-lg p-5 shadow-lg relative group';
                    card.innerHTML = `
                        <div class="absolute top-4 right-4 flex gap-3 opacity-100 lg:opacity-0 group-hover:opacity-100 transition duration-200">
                            <button onclick="duplicateRecipe(${r.id})" class="text-zinc-600 hover:text-blue-500" title="Дублировать">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button onclick="deleteRecipe(${r.id})" class="text-zinc-600 hover:text-red-500" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>

                        <h3 class="text-xl font-bold text-white mb-1 pr-16">${r.name}</h3>
                        <p class="text-zinc-400 text-sm font-mono mb-4 border-b border-zinc-800 pb-2">${r.filmSim}</p>

                        <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
                            
                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">Grain</span>
                                <span class="text-zinc-300 font-mono">${grainString}</span>
                            </div>
                            
                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">CC / FX Blue</span>
                                <span class="text-zinc-300 font-mono">${r.colorChrome} / ${r.colorChromeBlue}</span>
                            </div>

                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">DR</span>
                                <span class="text-zinc-300 font-mono">${r.dynamicRange}</span>
                            </div>

                            <div class="col-span-2 flex justify-between border-b border-zinc-800 border-dashed pb-1 pt-1">
                                <span class="text-zinc-500">WB</span>
                                <div class="text-right">
                                    <span class="text-zinc-300 font-mono mr-2">${wbString}</span>
                                    <span class="text-xs bg-zinc-800 px-1 rounded text-zinc-400 font-mono">${wbShift}</span>
                                </div>
                            </div>

                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1 pt-1">
                                <span class="text-zinc-500">H / S</span>
                                <span class="text-zinc-300 font-mono">${formatVal(r.highlight)} / ${formatVal(r.shadow)}</span>
                            </div>

                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">Color</span>
                                <span class="text-zinc-300 font-mono">${formatVal(r.color)}</span>
                            </div>
                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">Sharp</span>
                                <span class="text-zinc-300 font-mono">${formatVal(r.sharpness)}</span>
                            </div>
                            
                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">NR</span>
                                <span class="text-zinc-300 font-mono">${formatVal(r.nr)}</span>
                            </div>
                            <div class="flex justify-between border-b border-zinc-800 border-dashed pb-1">
                                <span class="text-zinc-500">Clarity</span>
                                <span class="text-zinc-300 font-mono">${formatVal(r.clarity)}</span>
                            </div>
                        </div>
                        
                        ${r.isoComment ? `<div class="mt-3 text-xs text-zinc-500 pt-2 border-t border-zinc-800">${r.isoComment}</div>` : ''}
                    `;
                    gridContainer.appendChild(card);
                } 
                
                // Render Table Row
                else {
                    const row = document.createElement('tr');
                    row.className = 'bg-zinc-900 border-b border-zinc-800 hover:bg-zinc-800 transition';
                    row.innerHTML = `
                        <th scope="row" class="px-4 py-3 font-medium text-white whitespace-nowrap sticky left-0 bg-zinc-900 border-r border-zinc-800 group-hover:bg-zinc-800">
                            ${r.name}
                        </th>
                        <td class="px-4 py-3 text-zinc-300 whitespace-nowrap">${r.filmSim}</td>
                        <td class="px-4 py-3 text-center whitespace-nowrap">
                            <div class="text-zinc-200">${wbString}</div>
                            <div class="text-xs text-zinc-500">${wbShift}</div>
                        </td>
                        <td class="px-4 py-3 text-center text-zinc-300 font-mono">${r.dynamicRange}</td>
                        <td class="px-4 py-3 text-center font-mono ${parseFloat(r.highlight) > 0 ? 'text-red-400' : 'text-zinc-400'}">${formatVal(r.highlight)}</td>
                        <td class="px-4 py-3 text-center font-mono ${parseFloat(r.shadow) > 0 ? 'text-red-400' : 'text-zinc-400'}">${formatVal(r.shadow)}</td>
                        <td class="px-4 py-3 text-center font-mono ${parseFloat(r.color) > 0 ? 'text-red-400' : 'text-zinc-400'}">${formatVal(r.color)}</td>
                        <td class="px-4 py-3 text-center font-mono ${parseFloat(r.sharpness) > 0 ? 'text-red-400' : 'text-zinc-400'}">${formatVal(r.sharpness)}</td>
                        <td class="px-4 py-3 text-center font-mono text-zinc-400">${formatVal(r.nr)}</td>
                        <td class="px-4 py-3 text-center font-mono text-zinc-400">${formatVal(r.clarity)}</td>
                        <td class="px-4 py-3 text-center text-zinc-400 text-xs">${grainString}</td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="duplicateRecipe(${r.id})" class="text-zinc-500 hover:text-blue-400 mr-3"><i class="fas fa-copy"></i></button>
                            <button onclick="deleteRecipe(${r.id})" class="text-zinc-500 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            });
        }

        // Initial Render
        renderRecipes();
        
    </script>
</body>
</html>
